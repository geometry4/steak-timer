<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>生成图标</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif;
           display: flex; flex-direction: column; align-items: center;
           padding: 40px; gap: 20px; }
    canvas { border-radius: 22px; }
    button { background: #FF9500; color: #000; border: none;
             padding: 12px 28px; border-radius: 10px;
             font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h2>煎牛排 App 图标生成器</h2>
  <canvas id="c" width="512" height="512"></canvas>
  <div style="display:flex;gap:12px">
    <button onclick="download(512,'icon-512.png')">下载 512×512</button>
    <button onclick="download(192,'icon-192.png')">下载 192×192</button>
    <button onclick="download(180,'apple-touch-icon.png')">下载 180×180 (iOS)</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function draw(size) {
      canvas.width = size;
      canvas.height = size;
      const r = size * 0.22;

      // 圆角深色背景
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();

      // 渐变背景
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#2a1a0a');
      grad.addColorStop(1, '#1a1a1c');
      ctx.fillStyle = grad;
      ctx.fill();

      // 微弱橙色光晕
      const glow = ctx.createRadialGradient(size*0.3, size*0.2, 0, size*0.3, size*0.2, size*0.6);
      glow.addColorStop(0, 'rgba(255,140,0,0.18)');
      glow.addColorStop(1, 'rgba(255,140,0,0)');
      ctx.fillStyle = glow;
      ctx.fill();

      // 表情
      ctx.font = `${size * 0.58}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🥩', size / 2, size * 0.52);
    }

    function download(size, filename) {
      draw(size);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      a.click();
      // Redraw 512 preview
      draw(512);
    }

    // 初始预览
    draw(512);
  </script>
</body>
</html>
